<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tech Digest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0b0f1a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .chip {
      display: inline-block;
      background: rgba(99,102,241,.2);
      border: 1px solid rgba(99,102,241,.4);
      border-radius: 100px;
      padding: 5px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a5b4fc;
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(32px, 7vw, 60px);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    h1 span { color: #818cf8; }
    p {
      font-size: 16px;
      color: #64748b;
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6366f1;
      margin: 0 auto;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.4); }
    }
  </style>
</head>
<body>
  <div class="chip">Daily Tech Digest</div>
  <h1>Top 10 <span>Tech &amp;<br>Startup</span> News</h1>
  <p>First edition is being prepared. Check back in a few minutes.</p>
  <div class="pulse"></div>
</body>
</html>
